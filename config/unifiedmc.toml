schema = 'unifiedmc-2'
server.name = 'UnifiedMC'
server.motd = 'UnifiedMC Server'
server.bind = '0.0.0.0'
server.java-port = 25565
server.bedrock-port = 19132
runtime.primary-version = '26.3'
runtime.default-backend = 'neoforge-26.3'
runtime.allow-multi-runtime = false
mods.fabric-directory = './FabricMods'
mods.forge-directory = './ForgeMods'
mods.neoforge-directory = './NeoForgeMods'
mods.auto-download-dependencies = false
mods.verify-signatures = true
mods.strict-dependencies = true
versions.allowed-client-versions = ['1.21.1', '26.1', '26.2', '26.3']
versions.backend-versions = ['26.3']
compatibility.enabled = true
compatibility.mode = 'STRICT'
compatibility.fail-on-unsupported = true
compatibility.allow-partial-support = false
bedrock.enabled = true
bedrock.geyser = true
bedrock.custom-content = false
bedrock.resource-packs = true
protocol.enabled = true
protocol.minimum-client = '1.21.1'
protocol.maximum-client = '26.3'
security.allow-unsigned-mods = false
security.isolated-runtimes = true
security.checksum-policy = 'REQUIRED'
logging.level = 'INFO'
logging.json = false
logging.file = './logs/unifiedmc.log'
storage.backend-directory = './backends'
storage.pack-directory = './packs'
storage.runtime-directory = './runtimes'
