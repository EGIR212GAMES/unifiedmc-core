name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'
      - name: Verify Java and build
        run: gradle --no-daemon clean build --stacktrace
      - name: Run tests
        run: gradle --no-daemon test --stacktrace
      - name: Verify dependency resolution
        run: gradle --no-daemon dependencies --stacktrace
      - name: Verify Java toolchains
        run: gradle --no-daemon javaToolchains --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/test-results/test/**'
          if-no-files-found: ignore
